<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6bd6"/>
      <stop offset="0.55" stop-color="#f545c9"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a20"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#shell)"/>

  <!-- Three offset plates, back to front. Two outlined, one solid: the stack
       reads as "layers" and survives a 16px render with no fine detail. -->
  <rect x="23" y="23" width="56" height="56" rx="15" fill="none"
        stroke="#f545c9" stroke-opacity="0.32" stroke-width="5"/>
  <rect x="37" y="37" width="56" height="56" rx="15" fill="none"
        stroke="#f545c9" stroke-opacity="0.64" stroke-width="5"/>
  <rect x="51" y="51" width="56" height="56" rx="15" fill="url(#plate)"/>
</svg>
